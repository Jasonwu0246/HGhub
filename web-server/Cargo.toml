[package]
name = "hghub-web"
version = "1.2.1"
description = "HGhub 网页版服务：复用 src-tauri 的 Rust 核心，经 HTTP 提供给浏览器（iOS Safari）"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[[bin]]
name = "hghub-web"
path = "src/main.rs"

[dependencies]
# 替身：让 src-tauri/src 的核心模块不改一行即可编译
tauri = { path = "shim/tauri" }
tauri-plugin-opener = { path = "shim/opener" }

# 与 src-tauri/Cargo.toml 保持一致的核心依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "fs", "process"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

# HTTP 服务
axum = { version = "0.8", features = ["form", "json", "query"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
